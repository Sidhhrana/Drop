name: Keep Render Server Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render free-tier spin down
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          if [ -n "${{ secrets.RENDER_SERVER_URL }}" ]; then
            echo "Pinging ${{ secrets.RENDER_SERVER_URL }}/health..."
            curl -s -f "${{ secrets.RENDER_SERVER_URL }}/health" || echo "Ping attempted."
          else
            echo "RENDER_SERVER_URL secret not set. Skipping ping."
          fi
